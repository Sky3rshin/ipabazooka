[package]
build = "build.rs"
name = "ipabazooka"
version = "1.4.0"
edition = "2021"

[[bin]]
name = "ipabazooka"
path = "src/main.rs"

[dependencies]
eframe = "=0.31.1"
egui = "=0.31.1"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
idevice ={ version = "0.1.61", default-features = false, features = ["ring", "usbmuxd", "installation_proxy", "amfi", "afc"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rootcause = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
serde_json = "1"
sha2 = "0.11"
rand = "0.8"

# isideload: patched copy that sends Apple's full sign-in identity headers
# (see vendor/isideload/NOTICE.md).
# Windows keeps the signing key in Windows Credential Manager (isideload's
# default "keyring" storage). Linux keeps it in the app's own private folder
# instead (see src/sideload.rs), so no system keyring or libdbus is needed.
[target.'cfg(windows)'.dependencies]
isideload = { path = "vendor/isideload" }

[target.'cfg(not(windows))'.dependencies]
isideload = { path = "vendor/isideload", default-features = false, features = ["install", "tokio-mt"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
srp = "=0.7.0-rc.3"
sha2 = "0.11"
num-bigint = "0.4"
pbkdf2 = "0.13"
hmac = "0.13"
